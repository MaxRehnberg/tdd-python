[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdd"]

[project]
name = "tdd"
version = "0.1.0"
description = "TDD training course"
requires-python = ">=3.13, <3.14"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.14", "pyright>=1.1", "pytest>=8.4"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
